      <stop offset="0%" stop-color="#3D2364"/>
      <stop offset="55%" stop-color="#2D1B4E"/>
      <stop offset="100%" stop-color="#1C0E33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#FF9F1C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
