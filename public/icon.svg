<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep aubergine -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D2364"/>
      <stop offset="55%" stop-color="#2D1B4E"/>
      <stop offset="100%" stop-color="#1C0E33"/>
    </linearGradient>
    <!-- Saffron glow -->
    <radialGradient id="glow" cx="0.85" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#FF9F1C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FF9F1C" stop-opacity="0"/>
    </radialGradient>
    <!-- Logo gradient -->
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#E8D9B8"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Logo: fork + arrow (delivery) -->
  <g transform="translate(256 256)">
    <!-- Fork (left side) -->
    <g transform="translate(-70 0)">
      <!-- Fork tines -->
      <rect x="-8" y="-100" width="6" height="40" rx="3" fill="url(#logo)"/>
      <rect x="2" y="-100" width="6" height="40" rx="3" fill="url(#logo)"/>
      <rect x="12" y="-100" width="6" height="40" rx="3" fill="url(#logo)"/>
      <!-- Fork body -->
      <path d="M -10 -60 Q -10 -50 0 -50 Q 10 -50 10 -60 L 10 -30 Q 10 -20 0 -20 Q -10 -20 -10 -30 Z" fill="url(#logo)"/>
      <!-- Fork handle -->
      <rect x="-4" y="-20" width="8" height="100" rx="4" fill="url(#logo)"/>
    </g>

    <!-- Arrow (right side, pointing right = delivery direction) -->
    <g transform="translate(60 0)">
      <!-- Arrow shaft -->
      <rect x="-50" y="-6" width="60" height="12" rx="6" fill="url(#saffron)"/>
      <!-- Arrow head -->
      <path d="M 10 -25 L 50 0 L 10 25 L 18 0 Z" fill="url(#saffron)"/>
    </g>
  </g>

  <!-- Saffron dot accent (top right, the "spark") -->
  <circle cx="380" cy="132" r="20" fill="#FF9F1C"/>
  <circle cx="380" cy="132" r="20" fill="none" stroke="#FBF7F0" stroke-width="6"/>
</svg>
