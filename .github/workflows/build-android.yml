name: Build 3 Android APKs (Customer + Merchant + Driver)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REJOFOOD_BACKEND_URL: ${{ secrets.REJOFOOD_BACKEND_URL || 'https://rejofood.vercel.app' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [customer, merchant, driver]
    name: Build ${{ matrix.role }} APK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor
        run: bun add @capacitor/core @capacitor/cli @capacitor/android

      - name: Generate capacitor.config.json for ${{ matrix.role }}
        run: |
          # Set NEXT_PUBLIC_APP_ROLE based on matrix
          ROLE_UPPER=$(echo "${{ matrix.role }}" | tr '[:lower:]' '[:upper:]')
          
          # Copy the role-specific config
          cp capacitor.${{ matrix.role }}.json capacitor.config.json
          
          # Remove TS config to avoid conflict
          rm -f capacitor.config.ts
          
          echo "Building APK for role: $ROLE_UPPER"
          cat capacitor.config.json

      - name: Create Android project
        run: |
          npx cap add android || true
          # Manual copy config because cap sync fails with server.url
          mkdir -p android/app/src/main/assets
          cp capacitor.config.json android/app/src/main/assets/
          echo '{"plugins":{}}' > android/app/src/main/assets/capacitor.plugins.json
          cat > android/capacitor.settings.gradle << 'EOF'
          ext {
            capacitor = [[]]
          }
          EOF
          npx cap sync android || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lint

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/rejofood-${{ matrix.role }}-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rejofood-${{ matrix.role }}-apk
          path: artifacts/rejofood-${{ matrix.role }}-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## ${{ matrix.role }} APK Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- App ID: \`id.rejofood.${{ matrix.role }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- App Name: RejoFood ${{ matrix.role }}" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: \`${{ env.REJOFOOD_BACKEND_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Role locked: ${{ matrix.role }}" >> $GITHUB_STEP_SUMMARY
